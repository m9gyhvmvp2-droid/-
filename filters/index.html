<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ef" />
  <title>Photo Shift — Camera Texture Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">PHOTO SHIFT</div>
        <h1>Camera Texture</h1>
      </div>
      <label class="ghost file-label">写真を選ぶ<input id="fileInput" type="file" accept="image/*" hidden></label>
    </header>

    <section id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="camera-mark">◉</div>
        <h2>普通の写真を、別のカメラで撮ったように。</h2>
        <p>3DS・写ルンです風・2000年代デジカメ風を、AIなしの画像処理で試せるプロトタイプです。</p>
        <label class="primary file-label">写真を選ぶ<input id="emptyFileInput" type="file" accept="image/*" hidden></label>
        <button id="demoBtn" class="secondary">デモ写真で試す</button>
      </div>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="preview-card">
        <div class="preview-head">
          <div id="presetName" class="preset-name">3DS</div>
          <button id="compareBtn" class="compare-btn">長押しで元画像</button>
        </div>
        <div class="canvas-shell">
          <canvas id="canvas"></canvas>
          <div id="loading" class="loading hidden">Processing…</div>
        </div>
      </div>

      <div class="controls-card">
        <div class="preset-tabs" role="tablist" aria-label="質感">
          <button class="preset-tab active" data-preset="3ds">3DS</button>
          <button class="preset-tab" data-preset="disposable">写ルンです</button>
          <button class="preset-tab" data-preset="digicam">デジカメ</button>
        </div>

        <div class="control-row">
          <div>
            <strong>Effect</strong>
            <p>元画像から質感への強さ</p>
          </div>
          <span id="intensityValue">70%</span>
        </div>
        <input id="intensity" type="range" min="0" max="100" value="70" />

        <div id="presetOptions" class="preset-options">
          <label class="option-row"><span>日付スタンプ</span><input id="dateStamp" type="checkbox"></label>
          <label class="option-row"><span>フラッシュ感</span><input id="flashBoost" type="checkbox"></label>
        </div>

        <div class="mini-note" id="presetNote">低解像度・色数制限・少しの寒色感・ノイズで3DSらしい画質に寄せます。</div>
      </div>
    </section>
  </main>

  <nav id="bottomBar" class="bottom-bar hidden">
    <button id="undoBtn" class="bottom-btn" disabled>↶<span>戻す</span></button>
    <button id="originalBtn" class="bottom-btn">◐<span>比較</span></button>
    <button id="saveBtn" class="bottom-btn primary-bottom">↓<span>保存</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
